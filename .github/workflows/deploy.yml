# Ubicación en el repo: .github/workflows/deploy.yml
name: Pipeline DevSecOps

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: api-fortaleza-nube

jobs:
  # =========================================================
  # JOB 1: Puerta de seguridad (SAST de dependencias + CVEs de imagen)
  # =========================================================
  seguridad:
    name: Análisis de seguridad
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # ---- Control 1: vulnerabilidades en librerías ----
      # --audit-level=high => el job FALLA si hay CVEs altas o críticas
      - name: Auditoría de dependencias (npm audit)
        run: npm audit --audit-level=high

      # ---- Construcción de la imagen ----
      - name: Construir imagen Docker
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      # ---- Control 2: CVEs del sistema operativo y librerías de la imagen ----
      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'          # 1 = rompe el pipeline si encuentra algo
          ignore-unfixed: true    # ignora CVEs sin parche disponible
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # =========================================================
  # JOB 2: Despliegue (solo si el JOB 1 pasó y es push a main)
  # =========================================================
  desplegar:
    name: Despliegue a EC2
    needs: seguridad
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Conectar por SSH y desplegar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ${{ secrets.APP_PATH }}
            git pull origin main
            docker compose build api
            docker compose up -d
            docker image prune -f
            docker compose ps
